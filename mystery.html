<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Three Little Penguins 🐧</title>

    <link rel="stylesheet" href="./style.css">

</head>


<body class="mystery-page">


    <!-- =========================================
         BACKGROUND MUSIC
    ========================================== -->

    <audio
        id="backgroundMusic"
        src="./music/birthday.mp3"
        loop
        preload="auto">
    </audio>


    <!-- MUSIC BUTTON -->

    <button
        id="musicButton"
        class="music-button"
        aria-label="Play or pause music">

        🎵

    </button>



    <!-- =========================================
         MAIN CONTENT
    ========================================== -->

    <div class="container">


        <h1>
            Three Little Surprises 💕
        </h1>


        <p class="subtitle">
            Three cute penguins are waiting for you...
            <br>
            Choose a mystery box! 🐧🎁
        </p>



        <div class="penguin-container">


            <!-- =====================================
                 PENGUIN 1
            ====================================== -->

            <div class="mystery-card">


                <!-- PENGUIN -->

                <div class="cute-penguin">

                    <div class="penguin-body">

                        <div
                            class="penguin-eye left-eye">
                        </div>

                        <div
                            class="penguin-eye right-eye">
                        </div>

                        <div class="penguin-beak">
                        </div>

                        <div class="penguin-belly">
                        </div>

                        <div
                            class="penguin-foot left-foot">
                        </div>

                        <div
                            class="penguin-foot right-foot">
                        </div>

                    </div>

                </div>


                <!-- GIFT BOX -->

                <a
                    href="./box1.html"
                    class="box-link"
                    aria-label="Open Mystery Box 1">

                    <div class="cute-gift">

                        <div class="gift-ribbon">
                        </div>

                        <div class="gift-lid">
                        </div>

                        <div class="gift-body">
                        </div>

                    </div>

                </a>


                <h2>
                    Mystery Box #1 🎁
                </h2>


                <p>
                    Something special is waiting...
                </p>

            </div>



            <!-- =====================================
                 PENGUIN 2
            ====================================== -->

            <div class="mystery-card">


                <!-- PENGUIN -->

                <div class="cute-penguin">

                    <div class="penguin-body">

                        <div
                            class="penguin-eye left-eye">
                        </div>

                        <div
                            class="penguin-eye right-eye">
                        </div>

                        <div class="penguin-beak">
                        </div>

                        <div class="penguin-belly">
                        </div>

                        <div
                            class="penguin-foot left-foot">
                        </div>

                        <div
                            class="penguin-foot right-foot">
                        </div>

                    </div>

                </div>


                <!-- PINK GIFT BOX -->

                <a
                    href="./box2.html"
                    class="box-link"
                    aria-label="Open Mystery Box 2">

                    <div class="cute-gift pink-gift">

                        <div class="gift-ribbon">
                        </div>

                        <div class="gift-lid">
                        </div>

                        <div class="gift-body">
                        </div>

                    </div>

                </a>


                <h2>
                    Mystery Box #2 🎁
                </h2>


                <p>
                    Another surprise is waiting...
                </p>

            </div>



            <!-- =====================================
                 PENGUIN 3
            ====================================== -->

            <div class="mystery-card">


                <!-- PENGUIN -->

                <div class="cute-penguin">

                    <div class="penguin-body">

                        <div
                            class="penguin-eye left-eye">
                        </div>

                        <div
                            class="penguin-eye right-eye">
                        </div>

                        <div class="penguin-beak">
                        </div>

                        <div class="penguin-belly">
                        </div>

                        <div
                            class="penguin-foot left-foot">
                        </div>

                        <div
                            class="penguin-foot right-foot">
                        </div>

                    </div>

                </div>


                <!-- PURPLE GIFT BOX -->

                <a
                    href="./box3.html"
                    class="box-link"
                    aria-label="Open Mystery Box 3">

                    <div class="cute-gift purple-gift">

                        <div class="gift-ribbon">
                        </div>

                        <div class="gift-lid">
                        </div>

                        <div class="gift-body">
                        </div>

                    </div>

                </a>


                <h2>
                    Mystery Box #3 🎁
                </h2>


                <p>
                    The biggest surprise is waiting...
                </p>

            </div>


        </div>


        <!-- =========================================
             SMALL MESSAGE
        ========================================== -->

        <p
            style="
                margin-top: 45px;
                color: #888;
                font-size: 16px;
            ">

            Click a gift box to open your surprise 💗

        </p>


    </div>



    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script src="./script.js"></script>


</body>

</html>
